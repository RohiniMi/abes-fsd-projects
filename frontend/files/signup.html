<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" type="text/css" href="../style/signup.css">
</head>

<body>

    <div class="container">
        <form class="account-form">
    
    

            <!-- Email Field -->
            <label for="email">Email address <span class="required">*</span></label>
            <input type="email" id="email" name="email" required>

            <!-- Password Field -->
            <label for="password">Create password</label>
            <input type="password" id="password" name="password">
            <a href="#" class="show-password">Show password</a>

            <!-- Re-type Password Field -->
            <label for="retype-password">Re-type password <span class="required">*</span></label>
            <input type="password" id="retype-password" name="retype-password" required>

            <!-- Terms and Conditions Checkbox -->
            <div class="checkbox-container">
                <label for="terms">Already have an account? <a href="./index.html">Log In</a>. </label>
            </div>
            <!-- Submit Button -->
            <button type="submit" class="btn">Create Account</button>
        </form>
    </div>
</body>

</html>
